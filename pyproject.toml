[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-coding-agent"
version = "0.2.0"
description = "A minimal single-agent coding assistant for learning agent loops."
requires-python = ">=3.10"
dependencies = [
    "openai>=3.19.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
